spring:
  application:
    name: virtual-art-gallery-backend
  
  # 数据源配置
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/art_gallery?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境使用update，生产环境使用validate或none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # OAuth2客户端配置
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时（毫秒）

# 文件存储配置
file:
  upload:
    path: ./uploads/
    # 通用配置
    max-size: 10485760
    allowed-extensions: jpg,jpeg,png,gif,webp
    allowed-mime-types: image/jpeg,image/png,image/gif,image/webp
    max-pixels: 30000000
    # 分类路径
    paths:
      avatar: ./uploads/avatars/
      artwork: ./uploads/artworks/

# GitHub API 配置
github:
  api:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    token-uri: https://github.com/login/oauth/access_token
    user-info-uri: https://api.github.com/user
    emails-api-url: https://api.github.com/user/emails

# 日志配置
logging:
  level:
    root: INFO
    com.artgallery: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/art-gallery.log

